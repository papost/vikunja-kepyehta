services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: vikunja
      POSTGRES_PASSWORD: vikunja
      POSTGRES_DB: vikunja
    volumes:
      - ./db:/var/lib/postgresql/data
    networks:
      - ix-portainer_default

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    depends_on:
      - db
    environment:
      VIKUNJA_DATABASE_TYPE: postgres
      VIKUNJA_DATABASE_HOST: db
      VIKUNJA_DATABASE_USER: vikunja
      VIKUNJA_DATABASE_PASSWORD: vikunja
      VIKUNJA_DATABASE_DATABASE: vikunja
      VIKUNJA_SERVICE_PUBLICURL: http://192.168.19.170:31020
      VIKUNJA_CORS_ENABLE: false
    ports:
      - "31020:31020"
    networks:
      - ix-portainer_default

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      VIKUNJA_CORS_ENABLE: false
    ports:
      - "8090:80"
    networks:
      - ix-portainer_default
    depends_on:
      - api

networks:
  ix-portainer_default:
    external: true
